name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pandas scipy scikit-learn matplotlib pyyaml pyarrow pytest
      - name: Unit tests
        run: pytest -q
      - name: Whole pipeline on the sample data
        run: python scripts/run_pipeline.py --config configs/sample.yaml
      - name: Extra numbers on the sample run
        run: python scripts/extra_numbers.py --config configs/sample.yaml
